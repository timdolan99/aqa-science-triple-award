name: Trigger auto deployment for separate-science-tutor

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/separate-science-tutor-AutoDeployTrigger-e4ee7904-e3c0-4a8d-b67b-a46244d86bf3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SEPARATESCIENCETUTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SEPARATESCIENCETUTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SEPARATESCIENCETUTOR_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.SEPARATESCIENCETUTOR_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SEPARATESCIENCETUTOR_REGISTRY_PASSWORD }}
          containerAppName: separate-science-tutor
          resourceGroup: socratic-tutor-rg
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


