name: Trigger auto deployment for separate-science-tutor

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SEPARATESCIENCETUTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SEPARATESCIENCETUTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SEPARATESCIENCETUTOR_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          acrName: ca3171a2918aacr
          containerAppName: separate-science-tutor
          resourceGroup: socratic-tutor-rg
